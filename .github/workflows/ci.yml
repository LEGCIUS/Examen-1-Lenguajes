name: CI Pipeline

# Pipeline de integracion continua. Se ejecuta automaticamente
# en cada push a master o pull request. Verifica que el proyecto
# este en buen estado antes de desplegar.
on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main ]



# Pasos del pipeline:
# 1. Descarga el codigo del repositorio
# 2. Instala Python 3.11
# 3. Instala las dependencias del proyecto
# 4. Verifica que Django no tenga errores de configuracion
# 5. Verifica que las migraciones esten al dia
jobs:
  verificar:
    name: Verificar proyecto
    runs-on: ubuntu-latest
      
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Verificar configuración de Django
        env:
          SECRET_KEY: clave-secreta-para-ci-tests
          DEBUG: "True"
          GOOGLE_CLIENT_ID: dummy-client-id.apps.googleusercontent.com
          CLOUDINARY_CLOUD_NAME: dummy
          CLOUDINARY_API_KEY: "000000000000000"
          CLOUDINARY_API_SECRET: dummy-secret
          DJANGO_SETTINGS_MODULE: settings.dev
        run: python manage.py check

      - name: Verificar que las migraciones estén al día
        env:
          SECRET_KEY: clave-secreta-para-ci-tests
          DEBUG: "True"
          GOOGLE_CLIENT_ID: dummy-client-id.apps.googleusercontent.com
          CLOUDINARY_CLOUD_NAME: dummy
          CLOUDINARY_API_KEY: "000000000000000"
          CLOUDINARY_API_SECRET: dummy-secret
          DJANGO_SETTINGS_MODULE: settings.dev
        run: python manage.py migrate --check || echo "Hay migraciones pendientes"
